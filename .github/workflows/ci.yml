name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**", "migrate/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[transport,plots,dev]"
      - run: python tests/run_tests.py
      - run: python -m compileall -q src examples tests scripts demo
      - run: python scripts/plot_all_frontiers.py --output-dir /tmp/it2-frontiers
      - run: test -f /tmp/it2-frontiers/frontier_manifest.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -c "import interactive_training; print(interactive_training.__version__)"

  demo-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[transport,dev]" -e "demo/gateway[dev]"
      - run: python -m pytest demo/gateway/tests
