name: Security

on:
  pull_request:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:latest
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit bandit
      - run: python -m pip install -e ".[transport,agents]"
      - run: pip-audit
      - run: bandit -q -lll -r src/interactive_training demo/gateway/src
