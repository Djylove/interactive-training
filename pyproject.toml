[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-training"
version = "2.0.1"
description = "Auditable live-control infrastructure for human- and agent-operated model training"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Wentao Zhang"},
  {name = "Xuanhe Pan"},
  {name = "Han Zhou"},
  {name = "Yang Lu"},
  {name = "Yuntian Deng"},
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://interactivetraining.ai"
Repository = "https://github.com/yuntian-group/interactive-training"
Documentation = "https://github.com/yuntian-group/interactive-training#readme"
Issues = "https://github.com/yuntian-group/interactive-training/issues"

[project.optional-dependencies]
transport = ["fastapi", "uvicorn"]
aim = ["aim>=3.17"]
agents = ["openai"]
hf = ["torch", "transformers>=4.45,<5", "datasets>=2.19,<5", "accelerate", "wandb", "tqdm"]
rlvr = ["torch", "transformers>=4.45,<5", "datasets>=2.19,<5", "peft", "vllm", "tqdm", "wandb"]
vision = ["torch", "torchvision", "scipy", "numpy", "wandb"]
plots = ["matplotlib>=3.8"]
dev = ["pytest", "httpx", "ruff", "build", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
